# Render Blueprint — النشر على الاستضافة المجانية.
#
# هيكل النشر:
#   React Frontend (static) -> Django API (web) -> PostgreSQL
#
# ملاحظة مهمة حول القيم النهائية:
# القيم أدناه مبنية على اسمي الخدمتين الفعليين على Render
# (boycott-api.onrender.com / boycott-frontend.onrender.com).
# قبل النشر، افتح الخدمتين في لوحة Render وتحقق من الرابط الفعلي،
# وإن اختلف النطاق عدّل القيم الثلاث التالية فقط:
#   - VITE_API_BASE_URL         (خدمة boycott-frontend)
#   - DJANGO_ALLOWED_HOSTS      (خدمة boycott-api)
#   - DJANGO_CORS_ORIGINS       (خدمة boycott-api)
#
# إعداد Build:
#   build.sh هو المسؤول الوحيد عن خطوات البناء والتهيئة:
#   pip install -> migrate -> (استيراد البيانات مرة واحدة فقط) -> init_admin
#   -> collectstatic -> ensure_media.
#   لذلك لا يوجد preDeployCommand حتى لا تتكرر migrations/loaddata.
#
# مهمة جداً بعد النشر (خطوة واحدة يدوياً):
#   - افتح إعدادات خدمة boycott-frontend على لوحة Render -> Redirects/Rewrites
#     وأضف قاعدة Rewrite: المصدر /* إلى /index.html
#     حتى تعمل روابط React Router عند فتح/تحديث أي صفحة مباشرة (مثل /product/...).
#     (ملف frontend/_redirects و frontend/vercel.json يغطيان Netlify/Cloudflare/Vercel.)
#
# ملاحظة: قاعدة بيانات PostgreSQL المجانية في Render تنتهي بعد 30 يوماً.
# للبقاء مجانياً إلى الأبد استخدم DATABASE_URL خارجياً (Neon/Supabase).

databases:
  - name: boycott-db
    plan: free
    databaseName: boycott
    user: boycott

services:
  - type: web
    name: boycott-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: >-
      gunicorn config.wsgi:application
      --workers 2 --threads 4
      --bind 0.0.0.0:$PORT
      --timeout 60 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.12"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "boycott-api.onrender.com"
      - key: DJANGO_CORS_ORIGINS
        value: "https://boycott-frontend.onrender.com"
      - key: DJANGO_SSL_REDIRECT
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: boycott-db
          property: connectionString

  - type: web
    name: boycott-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://boycott-api.onrender.com/api/v1"
